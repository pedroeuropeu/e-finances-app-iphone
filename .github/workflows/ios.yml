name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # o app usa o visual do iOS 26 (Liquid Glass): precisa do Xcode 26 ou mais novo
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Testes (regras, API, sessão, modo demonstração e telas)
        run: swift test --package-path Packages/EFinancesKit
      - name: Projeto do Xcode
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: App para o simulador (Demonstração e Produção, sem assinar)
        run: |
          for cfg in Demo Release; do
            scheme="EFinances Demo"; [ "$cfg" = "Release" ] && scheme="EFinances"
            xcodebuild -project EFinances.xcodeproj -scheme "$scheme" -configuration "$cfg" \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO build | tail -5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-simulador-demo
          path: build/DerivedData/Build/Products/Demo-iphonesimulator/EFinances.app
          retention-days: 14
